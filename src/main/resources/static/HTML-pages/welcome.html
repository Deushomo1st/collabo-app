<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>COLLABO — Welcome</title>
<link rel="stylesheet" href="/css/global/global.css">
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/login.css">
<link rel="stylesheet" href="/css/pages/welcome.css">
</head>
<body>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<div class="sp-shell">
    <div class="lg-theme" id="theme-slot"></div>
    <main class="lg-card wl-card sp-glass">
        <div class="wl-top">
            <div class="wl-bar" aria-hidden="true"><i id="wl-fill"></i></div>
            <button class="wl-skip" id="wl-skip" type="button">Skip setup</button>
        </div>
        <div class="wl-stage" id="wl-stage" aria-live="polite"></div>
        <p class="lg-error" id="wl-error" role="alert" hidden></p>
        <div class="wl-nav">
            <button class="sp-btn" id="wl-back" type="button">Back</button>
            <button class="sp-btn sp-btn--brand" id="wl-next" type="button">Next</button>
        </div>
    </main>
</div>
<script type="module" src="/js/pages/welcome.js"></script>
</body>
</html>
