<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10162a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})</script>
<title>COLLABO — Yarns</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/connections.css">
<link rel="stylesheet" href="/css/pages/gaze.css">
<link rel="stylesheet" href="/css/pages/yarnspaces.css">
</head>
<body data-home>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<div class="sp-shell">
    <div class="sp-top sp-top--feed" id="yn-top">
        <header class="tt-bar" id="yn-bar">
            <nav class="tt-tabs" id="filter-nav" role="tablist" aria-label="Kinds of yarns"></nav>
            <div class="tt-end" id="tt-end">
                <button class="tt-icon" id="find-btn" type="button" aria-label="Search yarns" title="Search yarns">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                </button>
                <button class="tt-icon" id="new-btn" type="button" aria-label="New yarn" title="New yarn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <span id="bell-slot"></span>
            </div>
        </header>
        <header class="sp-header sp-glass yn-header" id="yn-chat" hidden>
            <div class="yn-header__top">
                <button class="nav-return" id="yn-back" type="button" aria-label="Back to your yarns" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
                <span id="header-faces" class="yn-headfaces" hidden></span>
                <div class="sp-title">
                    <div class="sp-title__row"><h1 id="header-title">Yarns</h1><span class="sp-tag sp-tag--brand" id="header-tag">Yarnspaces</span></div>
                    <p id="header-sub"></p>
                </div>
                <button class="yn-gear" id="thread-wrench" type="button" aria-label="Yarnspace info" title="Yarnspace info" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </button>
            </div>

        </header>
        <div class="sp-island" id="island" hidden></div>
    </div>

    <main id="section" class="sp-section" aria-live="polite"></main>
</div>

<div id="nav"></div>
<div class="sp-toast" id="toast" role="status"></div>

<script type="module" src="/js/pages/yarnspaces.js"></script>
<script type="module" src="/js/services/bell.js"></script>
</body>
</html>
