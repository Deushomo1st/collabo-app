<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>COLLABO — Component Gallery</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* ---- Page colours (the page's own theme; components theme through css/global/theme.css) ---- */
    :root {
        color-scheme: dark;
        --g-bg: #0f0f0f;
        --g-text: #f9fafb;
        --g-muted: #8b93a1;
        --g-panel: #1a1a1a;
        --g-line: #2a2a2a;
        --g-demo-base: #10182b;
        --g-demo-text: #f9fafb;
        --g-demo-muted: #d1d5db;
        --g-demo-btn: rgba(16, 24, 43, 0.8);
        --g-demo-btn-hover: rgba(16, 24, 43, 0.95);
        --g-demo-btn-line: rgba(255, 255, 255, 0.18);
        --g-focus: #ffffff;

        /* Fluid spacing: tight on phones, roomy on desktops */
        --g-gutter: clamp(12px, 4vw, 32px);
        --g-stage-pad: clamp(1rem, 4vw, 2rem);
        --g-nav-space: calc(46px + 2 * 16px + env(safe-area-inset-bottom));   /* room for the bottom nav */
    }
    :root[data-theme="light"] {
        color-scheme: light;
        --g-bg: #f3f6f9;
        --g-text: #0f1b2d;
        --g-muted: #5b6472;
        --g-panel: #ffffff;
        --g-line: #dfe6ee;
        --g-demo-base: #e4edf5;
        --g-demo-text: #0f1b2d;
        --g-demo-muted: #3f4b5b;
        --g-demo-btn: rgba(255, 255, 255, 0.75);
        --g-demo-btn-hover: rgba(255, 255, 255, 0.95);
        --g-demo-btn-line: rgba(2, 48, 71, 0.18);
        --g-focus: #023047;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--g-bg);
        color: var(--g-text);
        padding: var(--g-gutter) var(--g-gutter) calc(var(--g-gutter) + var(--g-nav-space));
        transition: background 0.2s ease, color 0.2s ease;
    }

    /* Centred column that can never be wider than the screen */
    .gallery { width: min(960px, 100%); min-width: 0; margin-inline: auto; }
    .gallery__header { text-align: center; margin-bottom: clamp(1rem, 3vw, 1.5rem); }
    .gallery__header h1 { font-size: clamp(1.15rem, 1rem + 1.5vw, 1.5rem); margin: 0 0 0.25rem; }
    .gallery__header p { margin: 0; color: var(--g-muted); font-size: 0.85rem; }

    .gallery__meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.25rem 1rem;
        margin-bottom: 0.5rem;
    }
    .gallery__count {
        color: var(--g-muted);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }
    .gallery__title { font-size: clamp(1rem, 0.9rem + 0.8vw, 1.2rem); font-weight: 600; }

    .gallery__files {
        color: var(--g-muted);
        font-size: 0.8rem;
        margin-bottom: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;          /* long paths wrap instead of widening the page */
    }

    .gallery__stage {
        min-width: 0;
        border-radius: 14px;
        border: 1px solid var(--g-line);
        background: var(--g-panel);
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--g-stage-pad);
        margin-bottom: 1.5rem;
        transition: background 0.2s ease, border-color 0.2s ease;
    }
    .gallery__stage--transparent { background: transparent; border: 1px dashed var(--g-line); }
    .gallery__stage--full { padding: 0; align-items: stretch; justify-content: stretch; overflow: hidden; }
    .gallery__stage--full > * { width: 100%; min-width: 0; }

    .gallery__keys { margin: 0; text-align: center; color: var(--g-muted); font-size: 0.75rem; }
    .gallery__keys kbd {
        padding: 0.05rem 0.35rem;
        border: 1px solid var(--g-line);
        border-radius: 4px;
        font: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Theme switcher mount point in the header */
    .gallery__theme { display: flex; justify-content: center; margin-top: 0.75rem; }

    /* Demo stage for glass components: a busy background so blur and frost are visible */
    .gallery__demo {
        position: relative;
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: var(--g-stage-pad) clamp(0.75rem, 3vw, 1rem);
        color: var(--g-demo-text);
        background:
            radial-gradient(circle at 18% 28%, #FF9000 0 11%, transparent 12%),
            radial-gradient(circle at 78% 62%, #209EBB 0 15%, transparent 16%),
            radial-gradient(circle at 46% 88%, #7fcf9e 0 8%, transparent 9%),
            var(--g-demo-base);
    }
    .gallery__demo-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
    .gallery__demo-controls button {
        padding: 0.55rem 0.9rem;
        border-radius: 10px;
        border: 1px solid var(--g-demo-btn-line);
        background: var(--g-demo-btn);
        color: var(--g-demo-text);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
    }
    .gallery__demo-controls button:hover { background: var(--g-demo-btn-hover); }
    .gallery__demo-controls button:focus-visible { outline: 2px solid var(--g-focus); outline-offset: 2px; }
    .gallery__demo-result { min-height: 1.3em; margin: 0; color: var(--g-demo-muted); font-size: 0.85rem; text-align: center; }
    .gallery__demo-agenda { width: min(380px, 100%); }
    .gallery__demo--tall { min-height: 480px; }

    /* Nav selector demo: a scrollable box, because the nav iconizes on scroll */
    .gallery__scrollbox { width: 100%; height: clamp(260px, 50vh, 340px); overflow-y: auto; border-radius: 10px; }
    .gallery__scrollbox-content {
        max-width: 560px;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
        color: var(--g-muted);
        font-size: 0.85rem;
        line-height: 1.7;
    }
    .gallery__scrollbox-content strong { color: var(--g-text); }

    /* tilt-stack + avatar demos */
    .gallery__demo-stack { width: 100%; min-width: 0; }
    .gallery__demo-avatars { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: clamp(1.25rem, 5vw, 2.5rem); }
    .gallery__demo-bell { padding-top: 28px; }       /* room for the bell's string */
    .gallery__demo-modules {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
        gap: 1rem;
        width: min(640px, 100%);
    }
    .gallery__demo-modules .glass-module { padding: 1.1rem 1.2rem; }
    .gallery__demo-modules h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .gallery__demo-modules p { margin: 0; font-size: 0.85rem; color: var(--g-demo-muted); }

    @media (prefers-reduced-motion: reduce) {
        body, .gallery__stage { transition: none; }
    }
</style>
</head>
<body>

<div class="gallery">
    <div class="gallery__header">
        <h1>COLLABO — Component Gallery</h1>
        <p>Every self-contained UI component in the project, one page each.</p>
        <div class="gallery__theme" id="gallery-theme"></div>
    </div>

    <div class="gallery__meta">
        <span class="gallery__count" id="gallery-count"></span>
        <span class="gallery__title" id="gallery-title"></span>
    </div>

    <div class="gallery__files" id="gallery-files"></div>

    <div class="gallery__stage" id="gallery-stage" style="--nav-padding: 4px; --nav-link-padding: 8px 16px; --nav-font-size: 12px;"></div>

    <p class="gallery__keys"><kbd>←</kbd> <kbd>→</kbd> switch components · the bar at the bottom is the nav-selector component</p>
</div>

<!-- Page navigation: the nav-selector component, docked bottom-left -->
<div id="gallery-nav"></div>

<script type="module">
    import { mountNavSelector } from '/js/components/nav-selector-fluid-hold/nav-selector-fluid-hold.js';
    import { mountLiquidGlassModal, preloadLiquidGlassModal } from '/js/components/liquid-glass-modal/liquid-glass-modal.js';
    import { openGlassBlurDialog, glassBlurConfirm, glassBlurAlert, preloadGlassBlurDialog }
        from '/js/components/glass-blur-dialog/glass-blur-dialog.js';
    import { renderCalendarMonth, openCalendarRange, preloadCalendar }
        from '/js/components/calendar/calendar.js';
    import { mountFloatingDrawer } from '/js/components/floating-drawer/floating-drawer.js';
    import { mountNotificationBell } from '/js/components/notification-bell/notification-bell.js';
    import { loadGlassModule } from '/js/components/glass-module/glass-module.js';
    import { mountThemeSwitcher } from '/js/components/theme-switcher/theme-switcher.js';
    import { renderTiltStack, preloadTiltStack } from '/js/components/tilt-stack/tilt-stack.js';
    import { createAvatarCard, openAvatarUpload, preloadAvatar } from '/js/components/avatar/avatar.js';
    import { createActionBanner, preloadActionBanner } from '/js/components/action-banner/action-banner.js';
    import { createSwitch, preloadSwitch } from '/js/components/switch/switch.js';
    import { mountHoldFan } from '/js/components/hold-fan/hold-fan.js';

    // Placeholder "photos" for demos: a gradient with a head-and-shoulders silhouette (no network needed).
    const photo = (hue) => 'data:image/svg+xml,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">`
        + `<stop offset="0" stop-color="hsl(${hue} 70% 58%)"/><stop offset="1" stop-color="hsl(${hue + 40} 60% 28%)"/></linearGradient></defs>`
        + `<rect width="400" height="300" fill="url(#g)"/><circle cx="200" cy="118" r="54" fill="rgba(255,255,255,.55)"/>`
        + `<ellipse cx="200" cy="300" rx="112" ry="92" fill="rgba(255,255,255,.45)"/></svg>`);

    // Lucide icon paths (ISC licence), wrapped as inline SVG for demos.
    const svg = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    const ICON = {
        home: svg('<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
        calendar: svg('<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>'),
        users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
        folder: svg('<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>'),
        power: svg('<path d="M12 7v4"/><path d="M7.998 9.003a5 5 0 1 0 8-.005"/><circle cx="12" cy="12" r="10"/>'),
    };

    // Builds a glass-friendly demo area inside the stage.
    // demos: { 'Button label': async () => 'text to show under the buttons' | undefined }
    function mountDemo(stage, demos) {
        const wrap = document.createElement('div');
        wrap.className = 'gallery__demo';
        const controls = document.createElement('div');
        controls.className = 'gallery__demo-controls';
        const result = document.createElement('p');
        result.className = 'gallery__demo-result';
        result.setAttribute('aria-live', 'polite');

        Object.entries(demos).forEach(([label, run]) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = label;
            b.addEventListener('click', async () => {
                try {
                    const text = await run();
                    if (text) result.textContent = text;
                } catch (err) {
                    result.textContent = `Error: ${err.message}`;
                }
            });
            controls.appendChild(b);
        });

        wrap.append(controls, result);
        stage.appendChild(wrap);
        return { wrap, result };
    }

    const catalog = [

        {
            id: 'nav-selector-fluid-hold',
            title: 'Nav Selector',
            files: ['nav-selector-fluid-hold.html', 'nav-selector-fluid-hold.css', 'nav-selector-fluid-hold.js'],
            stageClass: 'gallery__stage--transparent gallery__stage--full',
            render: async (stage) => {
                // The nav iconizes when its scroll root scrolls down, so give it one.
                const box = document.createElement('div');
                box.className = 'gallery__scrollbox';
                stage.appendChild(box);
                const nav = await mountNavSelector(box, { scrollRoot: box, visible: 0 });   // visible: 0 = the original scrolling pill, not the hybrid

                const content = document.createElement('div');
                content.className = 'gallery__scrollbox-content';
                content.innerHTML = '<p><strong>Scroll down inside this box.</strong> The nav collapses to the active '
                    + 'section\'s icon. Scroll back up, click the icon, or wait for it to re-collapse after 1.5s idle.</p>'
                    + Array.from({ length: 10 }, (_, i) =>
                        `<p>Placeholder paragraph ${i + 1}. Enough content to scroll past the 40px threshold, so the `
                        + 'collapse and expand behaviour can be tried in both directions.</p>').join('');
                box.appendChild(content);
                return nav.destroy;
            },
        },

        {
            id: 'iplement-hybrid',
            dir: 'nav-selector-fluid-hold',   // a mode of the nav selector: it shows three links, the arrows sit outside the pill
            title: 'iplement hybrid',
            files: ['nav-selector-fluid-hold.html', 'nav-selector-fluid-hold.css', 'nav-selector-fluid-hold.js'],
            stageClass: 'gallery__stage--transparent gallery__stage--full',
            render: async (stage) => {
                const box = document.createElement('div');
                box.className = 'gallery__scrollbox';
                stage.appendChild(box);
                const ICO = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
                const nav = await mountNavSelector(box, {
                    collapseWhenIdle: true, idleMs: 4000, visible: 3, scrollRoot: box,   // inside the stage box like the other demos, not docked to the screen
                    links: ['Gaze', 'Yarns', 'Post', 'Spaces', 'Inbox', 'Settings'],
                    hrefs: ['#', '#', '#', '#', '#', '#'],
                    icons: [
                        '<path d="M3 10.5 12 3l9 7.5V21H3z"/>', '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
                        '<path d="M12 5v14M5 12h14"/>', '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
                        '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
                        '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
                    ].map(ICO),
                    activeIndex: 1,
                    onChange: () => {},
                });
                box.insertAdjacentHTML('beforeend', '<div class="gallery__scrollbox-content"><p><strong>Three at a time.</strong> '
                    + 'The pill hugs its three links; the arrows sit outside it. An arrow slides the window one link: the link behind '
                    + 'drops off, the next one on that side comes in. A dimmed arrow means nothing further that way, and tapping it does nothing. '
                    + 'Drag or swipe sideways (or scroll sideways): the links follow you, then lock onto the nearest three, so 2-3-4 works as well as 1-3 or 4-6. '
                    + 'Slide away from the black focus, pick nothing, let the pill collapse: it reopens on the lineup that holds the focus.</p></div>');
                return nav.destroy;
            },
        },

        {
            id: 'liquid-glass-modal',
            title: 'Liquid Glass Modal',
            files: ['liquid-glass-modal.html', 'liquid-glass-modal.css', 'liquid-glass-modal.js', 'README.md'],
            render: async (stage) => {
                preloadLiquidGlassModal();
                const wrap = document.createElement('div');
                wrap.style.cssText = `
                    position: relative;
                    width: 100%;
                    height: 100%;
                    min-height: 200px;
                    overflow: hidden;
                    border-radius: 14px;
                    background: oklch(0.2 0.035 255);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;
                wrap.innerHTML = `
                    <div style="position:absolute; top:15%; left:12%; width:100px; height:100px; border-radius:50%; background:oklch(0.76 0.13 175 / 0.5); filter:blur(40px);"></div>
                    <div style="position:absolute; bottom:15%; right:12%; width:140px; height:140px; border-radius:50%; background:oklch(0.91 0.16 104 / 0.4); filter:blur(50px);"></div>
                `;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = 'Preview Liquid Glass Modal';
                btn.style.cssText = `
                    position: relative;
                    z-index: 2;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 0.5rem;
                    min-height: 2.75rem;
                    padding: 0 1.25rem;
                    border-radius: 9999px;
                    border: 1px solid oklch(1 0 0 / 0.22);
                    background: oklch(0.98 0.02 240 / 0.1);
                    color: oklch(0.99 0.008 95);
                    font-family: inherit;
                    font-size: 0.875rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: background-color 300ms ease;
                `;
                btn.addEventListener('mouseenter', () => btn.style.backgroundColor = 'oklch(1 0 0 / 0.18)');
                btn.addEventListener('mouseleave', () => btn.style.backgroundColor = 'oklch(0.98 0.02 240 / 0.1)');
                btn.addEventListener('click', () => {
                    mountLiquidGlassModal(stage, { trigger: btn });
                });

                wrap.appendChild(btn);
                stage.appendChild(wrap);
            },
        },

        {
            id: 'glass-blur-dialog',
            title: 'Glass Blur Dialog',
            files: ['glass-blur-dialog.html', 'glass-blur-dialog.css', 'glass-blur-dialog.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                preloadGlassBlurDialog();
                mountDemo(stage, {
                    'Confirm': async () =>
                        `Confirm answered: ${await glassBlurConfirm('Publish this timetable to all staff?', { okText: 'Publish' })}`,
                    'Delete (danger)': async () =>
                        `Delete answered: ${await glassBlurConfirm('This removes the file for everyone.', { title: 'Delete file?', okText: 'Delete', danger: true })}`,
                    'Alert': async () => {
                        await glassBlurAlert('Saved.\nYour changes are live.');
                        return 'Alert closed';
                    },
                    'Form (sm)': async () => {
                        const dlg = await openGlassBlurDialog({
                            size: 'sm',
                            html: '<h2 class="glass-blur-dialog__title">Change password</h2>'
                                + '<label class="glass-blur-dialog__label" for="gallery-pw">New password</label>'
                                + '<input class="glass-blur-dialog__input" id="gallery-pw" type="password" autocomplete="new-password">'
                                + '<div class="glass-blur-dialog__actions" style="margin-top:18px">'
                                + '<button type="button" class="glass-blur-dialog__btn glass-blur-dialog__btn--ghost" data-action="cancel">Cancel</button>'
                                + '<button type="button" class="glass-blur-dialog__btn" data-action="save">Save password</button></div>',
                        });
                        dlg.panel.querySelector('[data-action="cancel"]').onclick = dlg.close;
                        dlg.panel.querySelector('[data-action="save"]').onclick = dlg.close;
                    },
                    'Stack 3': async () => {
                        const open = async (n) => {
                            const dlg = await openGlassBlurDialog({
                                html: `<h2 class="glass-blur-dialog__title">Dialog ${n}</h2>`
                                    + '<p class="glass-blur-dialog__text">Each new dialog frosts the one below it. Escape closes the top one.</p>'
                                    + (n < 3 ? `<div class="glass-blur-dialog__actions"><button type="button" class="glass-blur-dialog__btn" data-next>Open dialog ${n + 1}</button></div>` : ''),
                            });
                            const next = dlg.panel.querySelector('[data-next]');
                            if (next) next.onclick = () => open(n + 1);
                        };
                        await open(1);
                    },
                    'Clear glass': async () => {
                        await openGlassBlurDialog({
                            clear: true,
                            html: '<h2 class="glass-blur-dialog__title">Clear glass</h2>'
                                + '<p class="glass-blur-dialog__text">No backdrop darkening. Click outside to close.</p>',
                        });
                    },
                });
            },
        },

        {
            id: 'calendar',
            title: 'Calendar',
            files: ['calendar.html', 'calendar.css', 'calendar.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                preloadCalendar();
                const { wrap, result } = mountDemo(stage, {
                    'Pick a date range': async () => {
                        await openCalendarRange({
                            onApply: (from, to) => { result.textContent = `Range: ${from ?? '…'} to ${to ?? '…'}`; },
                        });
                    },
                });

                const agenda = document.createElement('div');
                agenda.className = 'gallery__demo-agenda';
                wrap.appendChild(agenda);

                const now = new Date();
                const day = (d) => `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                renderCalendarMonth(agenda, {
                    marks: { [day(3)]: ['event'], [day(12)]: ['exam', 'announcement'], [day(20)]: ['holiday'] },
                    onPick: (date) => { result.textContent = `Picked ${date.toDateString()}`; },
                });
            },
        },

        {
            id: 'floating-drawer',
            title: 'Floating Drawer',
            files: ['floating-drawer.html', 'floating-drawer.css', 'floating-drawer.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const { wrap, result } = mountDemo(stage, {});
                wrap.classList.add('gallery__demo--tall');
                result.textContent = 'Hover the tab at the top left to peek. Click it to expand.';
                const drawer = await mountFloatingDrawer(wrap, {
                    inline: true,
                    activeId: 'home',
                    items: [
                        { id: 'home', label: 'Home', icon: ICON.home },
                        { id: 'timetable', label: 'Timetable', icon: ICON.calendar },
                        { id: 'people', label: 'People', icon: ICON.users },
                        { id: 'files', label: 'Shared files', icon: ICON.folder },
                    ],
                    footer: [{ id: 'logout', label: 'Sign out', icon: ICON.power }],
                    onSelect: async (item) => {
                        if (item.id === 'logout') {
                            const yes = await glassBlurConfirm("You'll need to log in again to get back in.", { title: 'Sign out?', okText: 'Sign out', danger: true });
                            result.textContent = yes ? 'Signed out (demo)' : 'Stayed signed in';
                        } else {
                            result.textContent = `Opened ${item.label}. The tab now shows its icon.`;
                        }
                    },
                });
                return drawer.destroy;
            },
        },

        {
            id: 'notification-bell',
            title: 'Notification Bell',
            files: ['notification-bell.html', 'notification-bell.css', 'notification-bell.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const now = Date.now();
                const isoDaysAgo = (d) => new Date(now - d * 86400000).toISOString();
                const inbox = [
                    { id: 1, title: 'Timetable published', body: 'Term 1 timetable is live for all classes.', createdAt: isoDaysAgo(0), read: false, link: true },
                    { id: 2, title: 'Fee reminder', body: 'Three invoices are due this Friday.', createdAt: isoDaysAgo(2), read: false },
                    { id: 3, title: 'Welcome to Collabo', body: 'Your workspace is ready.', createdAt: isoDaysAgo(9), read: true },
                ];
                let nextId = 4;

                let bell;
                const { wrap, result } = mountDemo(stage, {
                    'Add a notification': async () => {
                        inbox.unshift({ id: nextId, title: `New message #${nextId}`, body: 'Arrived just now.', createdAt: new Date().toISOString(), read: false });
                        nextId++;
                        await bell.refresh();
                        return 'Added. The badge counts up and the bell rings.';
                    },
                    'Open the panel': async () => { await bell.open(); },
                });
                const bellHost = document.createElement('div');
                bellHost.className = 'gallery__demo-bell';
                wrap.prepend(bellHost);

                bell = await mountNotificationBell(bellHost, {
                    inline: true,
                    pollMs: 0,
                    loadItems: async () => inbox.map((n) => ({ ...n })),
                    isActionable: (n) => !!n.link,
                    onRead: (n) => { const src = inbox.find((x) => x.id === n.id); if (src) src.read = true; },
                    onSelect: (n) => { result.textContent = `Selected "${n.title}"`; },
                });
                return bell.destroy;
            },
        },

        {
            id: 'glass-module',
            title: 'Glass Module',
            files: ['glass-module.css', 'glass-module.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                await loadGlassModule();
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'CSS-only: add class="glass-module" to any container.';
                const grid = document.createElement('div');
                grid.className = 'gallery__demo-modules';
                grid.innerHTML = [
                    ['Attendance', '96% this week, up 2 points.'],
                    ['Next exam', 'Mathematics, Thursday 9:00.'],
                    ['Messages', '4 unread from staff.'],
                ].map(([h, p]) => `<section class="glass-module"><h3>${h}</h3><p>${p}</p></section>`).join('');
                wrap.prepend(grid);
            },
        },

        {
            id: 'theme-switcher',
            title: 'Theme Switcher',
            files: ['theme-switcher.html', 'theme-switcher.css', 'theme-switcher.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'This switcher and the one in the header stay in sync.';
                const sw = await mountThemeSwitcher(wrap, {
                    inline: true,
                    onChange: (theme) => { result.textContent = `Theme is now ${theme}. The choice is saved for next time.`; },
                });
                wrap.prepend(sw.element);
                return sw.destroy;
            },
        },

        {
            id: 'tilt-stack',
            title: 'Tilt Stack',
            files: ['tilt-stack.css', 'tilt-stack.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                await preloadTiltStack();
                const people = [
                    ['Ada Obi', 'Teacher', 20, 'active'], ['Tunde Bello', 'Bursar', null, 'active'],
                    ['Chioma Eze', 'Librarian', 200, 'on leave'], ['Musa Garba', 'Teacher', null, 'active'],
                    ['Ngozi Okafor', 'Teacher', 290, 'suspended'], ['Emeka Nwosu', 'Admin', 120, 'active'],
                    ['Halima Sani', 'Teacher', null, 'active'], ['Kunle Ade', 'Guardian', 330, 'active'],
                    ['Zainab Yusuf', 'Student', 60, 'active'],
                ].map(([name, subtitle, hue, status], i) => ({ id: i + 1, name, subtitle, status, avatar: hue == null ? null : photo(hue) }));
                const tone = (st) => ({ active: 'ok', 'on leave': 'warn', suspended: 'danger' }[st] || '');

                let activeOnly = false;
                let stack;
                const { wrap, result } = mountDemo(stage, {
                    'Spotlight someone': async () => {
                        const shown = activeOnly ? people.filter((p) => p.status === 'active') : people;
                        const pick = shown[Math.floor(Math.random() * shown.length)];
                        stack.highlight(pick.id);
                        return `Spotlighted ${pick.name} (what a table-row click does in SchoolHub)`;
                    },
                    'Toggle: active only': async () => {
                        activeOnly = !activeOnly;
                        draw();
                        return activeOnly ? 'Showing active people only' : 'Showing everyone';
                    },
                });
                result.textContent = 'Drag, scroll or Tab through the cards. Cards without a photo show initials.';
                const host = document.createElement('div');
                host.className = 'gallery__demo-stack';
                wrap.prepend(host);

                function draw() {
                    stack = renderTiltStack(host, activeOnly ? people.filter((p) => p.status === 'active') : people, {
                        label: 'People',
                        showStatus: true,
                        statusTone: tone,
                        onClick: (p) => { result.textContent = `Clicked ${p.name}, ${p.subtitle}`; },
                    });
                }
                draw();
                return () => stack.destroy();
            },
        },

        {
            id: 'avatar',
            title: 'Avatar',
            files: ['avatar.html', 'avatar.css', 'avatar.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                await preloadAvatar();
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'Click the "+" card to upload and crop a picture.';
                const row = document.createElement('div');
                row.className = 'gallery__demo-avatars';
                wrap.prepend(row);

                let current = null;
                function editableCard() {
                    return createAvatarCard({
                        src: current, name: 'You', editable: true,
                        onClick: () => openAvatarUpload({
                            current,
                            onSave: (dataUrl, blob) => {
                                current = dataUrl;
                                row.firstElementChild.replaceWith(editableCard());
                                result.textContent = dataUrl
                                    ? `Saved a 640×480 JPEG (${Math.round(blob.size / 1024)} KB). Click the card again to re-crop.`
                                    : 'Picture removed.';
                            },
                        }),
                    });
                }
                row.append(
                    editableCard(),
                    createAvatarCard({ src: photo(200), name: 'Chioma Eze' }),
                    createAvatarCard({ name: 'Tunde Bello' }),
                );
            },
        },

        {
            id: 'action-banner',
            title: 'Action Banner',
            files: ['action-banner.css', 'action-banner.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                await preloadActionBanner();
                const { wrap, result } = mountDemo(stage, {
                    'Bring the banner back': () => { show(); return 'A new claim is waiting.'; },
                });
                const slot = document.createElement('div');
                slot.style.cssText = 'width:min(640px,100%)';
                wrap.prepend(slot);
                function show() {
                    slot.replaceChildren(createActionBanner({
                        title: 'Amaka O. claims ₦30,000 paid to Tolu A.',
                        text: '“Prototype-day transport & printing” · Until confirmed this is only a claim, and the room is on hold.',
                        actions: [
                            { label: 'Confirm receipt', variant: 'ok', onClick: () => { slot.replaceChildren(); result.textContent = 'Confirmed. The room is open again.'; } },
                            { label: 'Cancel claim', variant: 'danger', onClick: () => { slot.replaceChildren(); result.textContent = 'Claim cancelled.'; } },
                        ],
                    }).element);
                }
                show();
                result.textContent = 'Pick an action; the banner clears itself.';
            },
        },

        {
            id: 'switch',
            title: 'Switch',
            files: ['switch.css', 'switch.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                await preloadSwitch();
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'Click or press Space on a switch.';
                const rows = document.createElement('div');
                rows.style.cssText = 'display:grid;gap:14px;width:min(360px,100%)';
                const row = (label, opts) => {
                    const line = document.createElement('label');
                    line.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--g-demo-text)';
                    const sw = createSwitch({ ...opts, label, onChange: (on) => { result.textContent = `${label}: ${on ? 'on' : 'off'}`; } });
                    line.append(label, sw.element);
                    return line;
                };
                rows.append(
                    row('Pleas', { checked: true }),
                    row('Response clock alerts', {}),
                    row('Owner (locked)', { checked: true, disabled: true }),
                );
                wrap.prepend(rows);
            },
        },

        {
            id: 'hold-fan',
            title: 'Hold Fan',
            files: ['hold-fan.css', 'hold-fan.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'Tap the round button, then press and hold it.';
                const btn = document.createElement('button');
                btn.type = 'button'; btn.setAttribute('aria-label', 'Hold me');
                btn.style.cssText = 'width:46px;height:46px;margin:90px auto 8px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:linear-gradient(145deg,#2b2f38,#0b0c0f);color:#fff;cursor:pointer';
                btn.innerHTML = ICON.home;
                btn.firstElementChild.style.cssText = 'width:18px;height:18px';
                btn.addEventListener('click', () => { result.textContent = 'A tap: the button keeps its normal click.'; });
                const pick = (name) => () => { result.textContent = `You chose ${name}.`; };
                const fan = mountHoldFan(btn, { actions: [
                    { label: 'Home', icon: ICON.home, onSelect: pick('Home') },
                    { label: 'Report', icon: svg('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'), onSelect: pick('Report') },
                    { label: 'Back', icon: svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'), onSelect: pick('Back') },
                ] });
                wrap.prepend(btn);
                return fan.destroy;
            },
        },

    ];

    const stage = document.getElementById('gallery-stage');
    const countEl = document.getElementById('gallery-count');
    const titleEl = document.getElementById('gallery-title');
    const filesEl = document.getElementById('gallery-files');

    // One icon per page for the bottom nav (Lucide paths, ISC licence).
    const PAGE_ICONS = {
        'nav-selector-fluid-hold': svg('<rect x="2" y="9" width="20" height="6" rx="3"/><circle cx="7" cy="12" r="1"/>'),
        'iplement-hybrid': svg('<path d="m15 18-6-6 6-6"/><rect x="8" y="9" width="8" height="6" rx="3"/>'),
        'liquid-glass-modal': svg('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>'),
        'glass-blur-dialog': svg('<rect width="18" height="14" x="3" y="5" rx="2"/><path d="M3 9h18"/>'),
        'calendar': ICON.calendar,
        'floating-drawer': svg('<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>'),
        'notification-bell': svg('<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>'),
        'glass-module': svg('<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/>'),
        'theme-switcher': svg('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'),
        'tilt-stack': svg('<path d="m12.83 2.18 8.58 3.91a1 1 0 0 1 0 1.83l-8.58 3.9a2 2 0 0 1-1.66 0L2.6 7.92a1 1 0 0 1 0-1.83l8.58-3.9a2 2 0 0 1 1.66 0z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/>'),
        'avatar': ICON.users,
        'action-banner': svg('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
        'hold-fan': svg('<circle cx="12" cy="18" r="3"/><circle cx="5" cy="8" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="19" cy="8" r="2"/>'),
        'switch': svg('<rect width="20" height="12" x="2" y="6" rx="6"/><circle cx="16" cy="12" r="2"/>'),
    };

    let current = -1;
    let cleanup = null;     // a page's render() may return a function that tears it down
    let pageNav = null;

    async function renderPage(index) {
        index = Math.max(0, Math.min(catalog.length - 1, index));
        if (index === current) return;
        const item = catalog[index];
        current = index;
        if (cleanup) { cleanup(); cleanup = null; }

        stage.className = 'gallery__stage ' + (item.stageClass || '');
        stage.textContent = ''; // clear the previous component

        countEl.textContent = `Component ${index + 1} of ${catalog.length}`;
        titleEl.textContent = item.title;
        filesEl.textContent = 'js/components/' + (item.dir || item.id) + '/  ·  ' + item.files.join('  ·  ');
        history.replaceState(null, '', '#' + item.id);   // reload or share keeps this page
        if (pageNav) pageNav.setActive(index);

        const teardown = await item.render(stage);
        if (typeof teardown === 'function') cleanup = teardown;
    }

    // Start on the page named in the URL (#calendar), else the first one.
    const fromHash = catalog.findIndex((c) => '#' + c.id === location.hash);
    const firstPage = fromHash >= 0 ? fromHash : 0;

    // Bottom page nav: the nav-selector component, docked bottom-left, growing to the right.
    pageNav = await mountNavSelector('#gallery-nav', {
        visible: 0,   // the original scrolling pill, not the hybrid
        placement: 'bottom',
        align: 'start',
        links: catalog.map((c) => c.title),
        hrefs: catalog.map((c) => '#' + c.id),
        icons: catalog.map((c) => PAGE_ICONS[c.id]),
        activeIndex: firstPage,
        collapseWhenIdle: true,               // tuck away after 3s without interaction
        idleMs: 3000,
        collapsedLabel: 'number',             // collapsed pill shows the page number
        onChange: (_label, href) => renderPage(catalog.findIndex((c) => href.endsWith('#' + c.id))),
    });

    // ← / → switch pages (ignored while typing in a field or inside a dialog).
    document.addEventListener('keydown', (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.target.closest('input, textarea, select, [contenteditable], [role="dialog"], .glass-blur-dialog, .tilt-stack')) return;
        if (e.key === 'ArrowRight') renderPage(current + 1);
        else if (e.key === 'ArrowLeft') renderPage(current - 1);
    });

    // Header theme switcher (the theme-switcher component, inline)
    mountThemeSwitcher('#gallery-theme', { inline: true });

    renderPage(firstPage);
</script>

</body>
</html>
