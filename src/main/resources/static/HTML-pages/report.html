<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10162a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})</script>
<title>COLLABO — Report a problem</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/gaze.css">
<link rel="stylesheet" href="/css/pages/report.css">
</head>
<body>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<!-- A page of its own, like the post page: the bar is Gaze, Yarns, Settings; hold it to leave. -->
<div class="sp-shell">
    <div class="sp-top">
        <header class="sp-header sp-glass">
            <div class="sp-title"><h1>Report a problem</h1><span class="sp-sub">Goes straight to the admin</span></div>
            <button type="submit" form="rp-form" class="gz-nav gz-nav--brand rp-send" id="send" aria-label="Send" title="Send"></button>
        </header>
    </div>

    <main class="rp-main" id="rp-main">
        <form id="rp-form" class="rp-grid" novalidate>
            <section class="rp-card sp-glass" aria-labelledby="rp-shot-h">
                <h2 id="rp-shot-h">Screenshot of the page</h2>
                <p class="rp-hint">Add a screenshot or a short video of what went wrong. Up to 3 files.</p>
                <div class="rp-shots" id="rp-shots" aria-live="polite"></div>
                <input type="file" id="rp-file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm" multiple hidden>
            </section>

            <section class="rp-card sp-glass" aria-labelledby="rp-sum-h">
                <h2 id="rp-sum-h">Summary write-up</h2>
                <label class="rp-hint" for="rp-text">What happened, and what did you expect to happen?</label>
                <textarea class="sp-input" id="rp-text" rows="9" maxlength="2000" placeholder="Describe the problem in a few sentences."></textarea>
                <div class="rp-meta"><span id="rp-from"></span><span id="rp-count">0 / 2000</span></div>
                <p class="gz-error" id="rp-error" role="alert" hidden></p>
            </section>
        </form>
    </main>
</div>

<div id="nav"></div>
<div class="sp-toast" id="toast" role="status"></div>
<script type="module" src="/js/pages/report.js"></script>
</body>
</html>
