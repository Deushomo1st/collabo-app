spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_URL:localhost:5432/collabo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:collabo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# Resend SMTP Configuration
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
# This tells Spring Boot to look for an environment variable named RESEND_API_KEY
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender identity for outbound mail (used by MailConfig / EmailService)
app.mail.from=Collabo Team <onboarding@collaboapp.pro>

# Admin panel shared secret — required in prod, must come from the environment
# (VPS .env via docker-compose env_file). Blank = admin endpoints fail closed with 503.
app.admin.key=${ADMIN_KEY:}

# Registration rate limiting (per client IP)
app.rate-limit.max-attempts=5
app.rate-limit.window-minutes=1
app.rate-limit.challenge-enabled=true

# Request throttling (token bucket, per caller). Each number is the burst and, over a minute (an hour for reports), the sustained rate.
# Signed-in callers are counted by account, everyone else by client IP. See RateLimitFilter.
app.throttle.enabled=true
app.throttle.auth-per-minute=10
app.throttle.admin-per-minute=60
app.throttle.report-per-hour=5
app.throttle.write-per-minute=60
app.throttle.read-per-minute=240

# Test accounts: when true, registration skips email-format validation, OTP,
# and email sending — every account created is verified immediately with
# is_test=true. Off by default; intended to be driven by a UI toggle later.
app.test-accounts.enabled=${ALLOW_TEST_ACCOUNTS:false}


# Login sessions: stored in Postgres so a restart does not sign everyone out.
# The cookie itself is configured in config/SessionConfig.
spring.session.jdbc.initialize-schema=always
spring.session.timeout=14d
# Set SESSION_COOKIE_SECURE=true in production (HTTPS). Off by default so http://localhost still works.
app.session.cookie-secure=${SESSION_COOKIE_SECURE:false}

# Pictures and videos on posts: one file per upload in this folder. In production it is a docker volume (see docker-compose.yaml).
app.media.dir=${MEDIA_DIR:./media}
