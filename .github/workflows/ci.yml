name: CI (tests only)

# Runs the test suite on feature branches and pull requests. No image is built or pushed and nothing is deployed;
# that stays in docker-build.yml, which only runs on main.
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: collabo
          POSTGRES_USER: collabo_user
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabo_user -d collabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # only CollaboBackendApplicationTests.contextLoads uses these; the other tests run on H2
      SPRING_DATASOURCE_URL: localhost:5432/collabo
      SPRING_DATASOURCE_USERNAME: collabo_user
      SPRING_DATASOURCE_PASSWORD: ci-password
      RESEND_API_KEY: ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -B test
