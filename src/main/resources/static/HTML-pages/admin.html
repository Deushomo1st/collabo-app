<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>COLLABO Admin</title>
<link rel="stylesheet" href="/css/pages/admin.css">
</head>
<body>

<div id="gate" class="ad-gate" hidden>
    <form id="gate-form" class="ad-gate__card" autocomplete="off">
        <h1>COLLABO <small>Admin</small></h1>
        <label class="ad-field"><span>Admin key</span><input id="gate-key" class="ad-input" type="password" autocomplete="off" autofocus></label>
        <button class="ad-btn ad-btn--primary" type="submit">Unlock</button>
        <p id="gate-error" class="ad-gate__error" role="alert"></p>
        <p class="ad-gate__hint">The key lives in ADMIN_KEY on the server. It is kept for this tab only.</p>
    </form>
</div>

<div id="app" class="ad-app" hidden>
    <aside class="ad-side">
        <div class="ad-brand">COLLABO <small>Admin</small></div>
        <nav id="nav" aria-label="Admin sections"></nav>
        <button id="signout" class="ad-btn ad-btn--small" type="button">Sign out</button>
    </aside>
    <div class="ad-main">
        <div id="strip" class="ad-strip" aria-label="System status"></div>
        <main id="view"></main>
    </div>
</div>

<div id="notices" class="ad-notices" aria-live="polite"></div>
<noscript><p style="padding:24px">The admin console needs JavaScript.</p></noscript>
<script type="module" src="/js/pages/admin/admin.js"></script>
</body>
</html>
