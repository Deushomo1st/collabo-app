<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Return button">
  <!-- the header Return button (a round button with a chevron), dusk theme. Transparent background. -->
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f38"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <circle cx="120" cy="120" r="92" fill="#ffffff" opacity=".35" filter="url(#glow)"/>
  <circle cx="120" cy="120" r="84" fill="url(#r)" stroke="#4a505c" stroke-width="3" filter="url(#drop)"/>
  <path d="m138 82-38 38 38 38" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
