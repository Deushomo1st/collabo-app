services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collabo
      POSTGRES_USER: collabo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/collabo
      - MEDIA_DIR=/app/media
    volumes:
      - media_data:/app/media
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
  media_data:
