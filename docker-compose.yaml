services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collabo
      POSTGRES_USER: collabo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    env_file:
      - .env  # <-- This explicitly tells Docker to read the .env file
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
