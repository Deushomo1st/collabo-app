<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join COLLABO</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #111827; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #374151; font-size: 0.875rem; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't break width */
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
            display: none;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create your COLLABO account</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="johndoe">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="role">Account Type</label>
            <select id="role" required>
                <option value="USER">Standard User</option>
                <option value="ADMIN">Administrator</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <div id="messageBox" class="message"></div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('messageBox');
        
        // Disable button and show loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        messageBox.style.display = 'none';

        // Gather data
        const payload = {
            email: document.getElementById('email').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };

        try {
            const response = await fetch('https://collaboapp.pro/api/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const data = await response.json();
                messageBox.textContent = `Success! Welcome, ${data.username}. Your ID is ${data.id.substring(0, 8)}...`;
                messageBox.className = 'message success';
                messageBox.style.display = 'block';
                document.getElementById('registerForm').reset();
            } else {
                const errorData = await response.json();
                messageBox.textContent = `Error: ${errorData.message || 'Failed to create account. Email might be taken.'}`;
                messageBox.className = 'message error';
                messageBox.style.display = 'block';
            }
        } catch (error) {
            messageBox.textContent = 'Network error. Please try again.';
            messageBox.className = 'message error';
            messageBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
        }
    });
</script>

</body>
</html>
