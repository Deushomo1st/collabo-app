<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>COLLABO — Yarns</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/yarnspaces.css">
</head>
<body>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<div class="sp-shell">
    <div class="sp-top">
        <header class="sp-header sp-glass yn-header">
            <div class="yn-header__top">
                <a class="sp-back" id="header-back" href="/HTML-pages/gaze.html" aria-label="Back to The Gaze">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </a>
                <div class="sp-title">
                    <div class="sp-title__row"><h1 id="header-title">Yarns</h1><span class="sp-tag sp-tag--brand" id="header-tag">Yarnspaces</span></div>
                    <p id="header-sub"></p>
                </div>
                <button class="yn-gear" id="thread-wrench" type="button" aria-label="Yarnspace settings" title="Yarnspace settings" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </button>
                <button class="yn-gear" id="new-btn" type="button" aria-label="New yarn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button class="yn-gear" id="settings-btn" type="button" aria-label="Yarns settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <span id="bell-slot"></span>
            <div id="theme-slot"></div>
            </div>
            <input class="yn-search" id="search" type="search" placeholder="Search yarns" aria-label="Search yarns" autocomplete="off">
        </header>
    </div>

    <main id="section" class="sp-section" aria-live="polite"></main>
</div>

<div id="nav"></div>
<div class="sp-toast" id="toast" role="status"></div>

<script type="module" src="/js/pages/yarnspaces.js"></script>
<script type="module" src="/js/services/bell.js"></script>
</body>
</html>
