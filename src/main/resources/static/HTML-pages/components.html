<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLLABO — Component Gallery</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #f9fafb;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
    }
    .gallery { width: min(960px, 100%); }
    .gallery__header { text-align: center; margin-bottom: 1.5rem; }
    .gallery__header h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .gallery__header p { margin: 0; color: #6b7280; font-size: 0.85rem; }

    .gallery__meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.5rem;
    }
    .gallery__count {
        color: #6b7280;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }
    .gallery__title { font-size: 1.2rem; font-weight: 600; }

    .gallery__files {
        color: #6b7280;
        font-size: 0.8rem;
        margin-bottom: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .gallery__stage {
        border-radius: 14px;
        border: 1px solid #2a2a2a;
        background: #1a1a1a;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        margin-bottom: 1.5rem;
        transition: background 0.2s ease;
    }
    .gallery__stage--transparent { background: transparent; border: 1px dashed #2a2a2a; }
    .gallery__stage--light { background: #f5f5f5; border-color: #e5e5e5; }
    .gallery__stage--full { padding: 0; align-items: stretch; justify-content: stretch; overflow: hidden; }
    .gallery__stage--full > * { width: 100%; }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .pagination button {
        min-width: 2.25rem;
        height: 2.25rem;
        padding: 0 0.7rem;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #1a1a1a;
        color: #d1d5db;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .pagination button:hover:not(:disabled) { background: #2a2a2a; color: #fff; }
    .pagination button.is-active { background: #ffffff; color: #111; border-color: #ffffff; font-weight: 600; }
    .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Theme switcher mount point in the header */
    .gallery__theme { display: flex; justify-content: center; margin-top: 0.75rem; }

    /* Demo stage for glass components: a busy background so blur and frost are visible */
    .gallery__demo {
        position: relative;
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1rem;
        background:
            radial-gradient(circle at 18% 28%, #FF9000 0 11%, transparent 12%),
            radial-gradient(circle at 78% 62%, #209EBB 0 15%, transparent 16%),
            radial-gradient(circle at 46% 88%, #7fcf9e 0 8%, transparent 9%),
            #10182b;
    }
    .gallery__demo-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
    .gallery__demo-controls button {
        padding: 0.55rem 0.9rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(16, 24, 43, 0.8);
        color: #f9fafb;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
    }
    .gallery__demo-controls button:hover { background: rgba(16, 24, 43, 0.95); border-color: rgba(255, 255, 255, 0.35); }
    .gallery__demo-controls button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .gallery__demo-result { min-height: 1.3em; margin: 0; color: #d1d5db; font-size: 0.85rem; }
    .gallery__demo-agenda { width: min(380px, 100%); }
    .gallery__demo--tall { min-height: 480px; }
    .gallery__demo-bell { padding-top: 28px; }       /* room for the bell's string */
    .gallery__demo-modules {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        width: min(640px, 100%);
    }
    .gallery__demo-modules .glass-module { padding: 1.1rem 1.2rem; }
    .gallery__demo-modules h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .gallery__demo-modules p { margin: 0; font-size: 0.85rem; color: #d1d5db; }
</style>
</head>
<body>

<div class="gallery">
    <div class="gallery__header">
        <h1>COLLABO — Component Gallery</h1>
        <p>Every self-contained UI component in the project, one page each.</p>
        <div class="gallery__theme" id="gallery-theme"></div>
    </div>

    <div class="gallery__meta">
        <span class="gallery__count" id="gallery-count"></span>
        <span class="gallery__title" id="gallery-title"></span>
    </div>

    <div class="gallery__files" id="gallery-files"></div>

    <div class="gallery__stage" id="gallery-stage" style="--nav-padding: 4px; --nav-link-padding: 8px 16px; --nav-font-size: 12px;"></div>

    <nav class="pagination" id="pagination" aria-label="Component pages"></nav>
</div>

<script type="module">
    import { mountNavSelector } from '/js/components/nav-selector-fluid-hold/nav-selector-fluid-hold.js';
    import { mountLiquidGlassModal } from '/js/components/liquid-glass-modal/liquid-glass-modal.js';
    import { openGlassBlurDialog, glassBlurConfirm, glassBlurAlert, preloadGlassBlurDialog }
        from '/js/components/glass-blur-dialog/glass-blur-dialog.js';
    import { renderCalendarMonth, openCalendarRange, preloadCalendar }
        from '/js/components/calendar/calendar.js';
    import { mountFloatingDrawer } from '/js/components/floating-drawer/floating-drawer.js';
    import { mountNotificationBell } from '/js/components/notification-bell/notification-bell.js';
    import { loadGlassModule } from '/js/components/glass-module/glass-module.js';
    import { mountThemeSwitcher } from '/js/components/theme-switcher/theme-switcher.js';

    // Lucide icon paths (ISC licence), wrapped as inline SVG for demos.
    const svg = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    const ICON = {
        home: svg('<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
        calendar: svg('<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>'),
        users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
        folder: svg('<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>'),
        power: svg('<path d="M12 7v4"/><path d="M7.998 9.003a5 5 0 1 0 8-.005"/><circle cx="12" cy="12" r="10"/>'),
    };

    // Builds a glass-friendly demo area inside the stage.
    // demos: { 'Button label': async () => 'text to show under the buttons' | undefined }
    function mountDemo(stage, demos) {
        const wrap = document.createElement('div');
        wrap.className = 'gallery__demo';
        const controls = document.createElement('div');
        controls.className = 'gallery__demo-controls';
        const result = document.createElement('p');
        result.className = 'gallery__demo-result';
        result.setAttribute('aria-live', 'polite');

        Object.entries(demos).forEach(([label, run]) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = label;
            b.addEventListener('click', async () => {
                try {
                    const text = await run();
                    if (text) result.textContent = text;
                } catch (err) {
                    result.textContent = `Error: ${err.message}`;
                }
            });
            controls.appendChild(b);
        });

        wrap.append(controls, result);
        stage.appendChild(wrap);
        return { wrap, result };
    }

    const catalog = [

        {
            id: 'nav-selector-fluid-hold',
            title: 'Nav Selector',
            files: ['nav-selector-fluid-hold.html', 'nav-selector-fluid-hold.css', 'nav-selector-fluid-hold.js'],
            stageClass: 'gallery__stage--transparent',
            render: async () => { await mountNavSelector('#gallery-stage'); },
        },

        {
            id: 'liquid-glass-modal',
            title: 'Liquid Glass Modal',
            files: ['liquid-glass-modal.html', 'liquid-glass-modal.css', 'liquid-glass-modal.js'],
            render: async (stage) => {
                const wrap = document.createElement('div');
                wrap.style.cssText = `
                    position: relative;
                    width: 100%;
                    height: 100%;
                    min-height: 200px;
                    overflow: hidden;
                    border-radius: 14px;
                    background: oklch(0.2 0.035 255);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;
                wrap.innerHTML = `
                    <div style="position:absolute; top:15%; left:12%; width:100px; height:100px; border-radius:50%; background:oklch(0.76 0.13 175 / 0.5); filter:blur(40px);"></div>
                    <div style="position:absolute; bottom:15%; right:12%; width:140px; height:140px; border-radius:50%; background:oklch(0.91 0.16 104 / 0.4); filter:blur(50px);"></div>
                `;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = 'Preview Liquid Glass Modal';
                btn.style.cssText = `
                    position: relative;
                    z-index: 2;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 0.5rem;
                    min-height: 2.75rem;
                    padding: 0 1.25rem;
                    border-radius: 9999px;
                    border: 1px solid oklch(1 0 0 / 0.22);
                    background: oklch(0.98 0.02 240 / 0.1);
                    color: oklch(0.99 0.008 95);
                    font-family: inherit;
                    font-size: 0.875rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: background-color 300ms ease;
                `;
                btn.addEventListener('mouseenter', () => btn.style.backgroundColor = 'oklch(1 0 0 / 0.18)');
                btn.addEventListener('mouseleave', () => btn.style.backgroundColor = 'oklch(0.98 0.02 240 / 0.1)');
                btn.addEventListener('click', () => {
                    mountLiquidGlassModal('#gallery-stage');
                });

                wrap.appendChild(btn);
                stage.appendChild(wrap);
            },
        },

        {
            id: 'glass-blur-dialog',
            title: 'Glass Blur Dialog',
            files: ['glass-blur-dialog.html', 'glass-blur-dialog.css', 'glass-blur-dialog.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                preloadGlassBlurDialog();
                mountDemo(stage, {
                    'Confirm': async () =>
                        `Confirm answered: ${await glassBlurConfirm('Publish this timetable to all staff?', { okText: 'Publish' })}`,
                    'Delete (danger)': async () =>
                        `Delete answered: ${await glassBlurConfirm('This removes the file for everyone.', { title: 'Delete file?', okText: 'Delete', danger: true })}`,
                    'Alert': async () => {
                        await glassBlurAlert('Saved.\nYour changes are live.');
                        return 'Alert closed';
                    },
                    'Form (sm)': async () => {
                        const dlg = await openGlassBlurDialog({
                            size: 'sm',
                            html: '<h2 class="glass-blur-dialog__title">Change password</h2>'
                                + '<label class="glass-blur-dialog__label" for="gallery-pw">New password</label>'
                                + '<input class="glass-blur-dialog__input" id="gallery-pw" type="password" autocomplete="new-password">'
                                + '<div class="glass-blur-dialog__actions" style="margin-top:18px">'
                                + '<button type="button" class="glass-blur-dialog__btn glass-blur-dialog__btn--ghost" data-action="cancel">Cancel</button>'
                                + '<button type="button" class="glass-blur-dialog__btn" data-action="save">Save password</button></div>',
                        });
                        dlg.panel.querySelector('[data-action="cancel"]').onclick = dlg.close;
                        dlg.panel.querySelector('[data-action="save"]').onclick = dlg.close;
                    },
                    'Stack 3': async () => {
                        const open = async (n) => {
                            const dlg = await openGlassBlurDialog({
                                html: `<h2 class="glass-blur-dialog__title">Dialog ${n}</h2>`
                                    + '<p class="glass-blur-dialog__text">Each new dialog frosts the one below it. Escape closes the top one.</p>'
                                    + (n < 3 ? `<div class="glass-blur-dialog__actions"><button type="button" class="glass-blur-dialog__btn" data-next>Open dialog ${n + 1}</button></div>` : ''),
                            });
                            const next = dlg.panel.querySelector('[data-next]');
                            if (next) next.onclick = () => open(n + 1);
                        };
                        await open(1);
                    },
                    'Clear glass': async () => {
                        await openGlassBlurDialog({
                            clear: true,
                            html: '<h2 class="glass-blur-dialog__title">Clear glass</h2>'
                                + '<p class="glass-blur-dialog__text">No backdrop darkening. Click outside to close.</p>',
                        });
                    },
                });
            },
        },

        {
            id: 'calendar',
            title: 'Calendar',
            files: ['calendar.html', 'calendar.css', 'calendar.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                preloadCalendar();
                const { wrap, result } = mountDemo(stage, {
                    'Pick a date range': async () => {
                        await openCalendarRange({
                            onApply: (from, to) => { result.textContent = `Range: ${from ?? '…'} to ${to ?? '…'}`; },
                        });
                    },
                });

                const agenda = document.createElement('div');
                agenda.className = 'gallery__demo-agenda';
                wrap.appendChild(agenda);

                const now = new Date();
                const day = (d) => `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                renderCalendarMonth(agenda, {
                    marks: { [day(3)]: ['event'], [day(12)]: ['exam', 'announcement'], [day(20)]: ['holiday'] },
                    onPick: (date) => { result.textContent = `Picked ${date.toDateString()}`; },
                });
            },
        },

        {
            id: 'floating-drawer',
            title: 'Floating Drawer',
            files: ['floating-drawer.html', 'floating-drawer.css', 'floating-drawer.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const { wrap, result } = mountDemo(stage, {});
                wrap.classList.add('gallery__demo--tall');
                result.textContent = 'Hover the tab at the top left to peek. Click it to expand.';
                const drawer = await mountFloatingDrawer(wrap, {
                    inline: true,
                    activeId: 'home',
                    items: [
                        { id: 'home', label: 'Home', icon: ICON.home },
                        { id: 'timetable', label: 'Timetable', icon: ICON.calendar },
                        { id: 'people', label: 'People', icon: ICON.users },
                        { id: 'files', label: 'Shared files', icon: ICON.folder },
                    ],
                    footer: [{ id: 'logout', label: 'Sign out', icon: ICON.power }],
                    onSelect: async (item) => {
                        if (item.id === 'logout') {
                            const yes = await glassBlurConfirm("You'll need to log in again to get back in.", { title: 'Sign out?', okText: 'Sign out', danger: true });
                            result.textContent = yes ? 'Signed out (demo)' : 'Stayed signed in';
                        } else {
                            result.textContent = `Opened ${item.label}. The tab now shows its icon.`;
                        }
                    },
                });
                return drawer.destroy;
            },
        },

        {
            id: 'notification-bell',
            title: 'Notification Bell',
            files: ['notification-bell.html', 'notification-bell.css', 'notification-bell.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const now = Date.now();
                const isoDaysAgo = (d) => new Date(now - d * 86400000).toISOString();
                const inbox = [
                    { id: 1, title: 'Timetable published', body: 'Term 1 timetable is live for all classes.', createdAt: isoDaysAgo(0), read: false, link: true },
                    { id: 2, title: 'Fee reminder', body: 'Three invoices are due this Friday.', createdAt: isoDaysAgo(2), read: false },
                    { id: 3, title: 'Welcome to Collabo', body: 'Your workspace is ready.', createdAt: isoDaysAgo(9), read: true },
                ];
                let nextId = 4;

                let bell;
                const { wrap, result } = mountDemo(stage, {
                    'Add a notification': async () => {
                        inbox.unshift({ id: nextId, title: `New message #${nextId}`, body: 'Arrived just now.', createdAt: new Date().toISOString(), read: false });
                        nextId++;
                        await bell.refresh();
                        return 'Added. The badge counts up and the bell rings.';
                    },
                    'Open the panel': async () => { await bell.open(); },
                });
                const bellHost = document.createElement('div');
                bellHost.className = 'gallery__demo-bell';
                wrap.prepend(bellHost);

                bell = await mountNotificationBell(bellHost, {
                    inline: true,
                    pollMs: 0,
                    loadItems: async () => inbox.map((n) => ({ ...n })),
                    isActionable: (n) => !!n.link,
                    onRead: (n) => { const src = inbox.find((x) => x.id === n.id); if (src) src.read = true; },
                    onSelect: (n) => { result.textContent = `Selected "${n.title}"`; },
                });
                return bell.destroy;
            },
        },

        {
            id: 'glass-module',
            title: 'Glass Module',
            files: ['glass-module.css', 'glass-module.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                await loadGlassModule();
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'CSS-only: add class="glass-module" to any container.';
                const grid = document.createElement('div');
                grid.className = 'gallery__demo-modules';
                grid.innerHTML = [
                    ['Attendance', '96% this week, up 2 points.'],
                    ['Next exam', 'Mathematics, Thursday 9:00.'],
                    ['Messages', '4 unread from staff.'],
                ].map(([h, p]) => `<section class="glass-module"><h3>${h}</h3><p>${p}</p></section>`).join('');
                wrap.prepend(grid);
            },
        },

        {
            id: 'theme-switcher',
            title: 'Theme Switcher',
            files: ['theme-switcher.html', 'theme-switcher.css', 'theme-switcher.js', 'README.md'],
            stageClass: 'gallery__stage--full',
            render: async (stage) => {
                const { wrap, result } = mountDemo(stage, {});
                result.textContent = 'This switcher and the one in the header stay in sync.';
                const sw = await mountThemeSwitcher(wrap, {
                    inline: true,
                    onChange: (theme) => { result.textContent = `Theme is now ${theme}. The choice is saved for next time.`; },
                });
                wrap.prepend(sw.element);
                return sw.destroy;
            },
        },

    ];

    const stage = document.getElementById('gallery-stage');
    const countEl = document.getElementById('gallery-count');
    const titleEl = document.getElementById('gallery-title');
    const filesEl = document.getElementById('gallery-files');
    const pagination = document.getElementById('pagination');

    let current = 0;
    let cleanup = null;     // a page's render() may return a function that tears it down

    async function renderPage(index) {
        const item = catalog[index];
        current = index;
        if (cleanup) { cleanup(); cleanup = null; }

        stage.className = 'gallery__stage ' + (item.stageClass || '');
        stage.textContent = ''; // clear the previous component

        countEl.textContent = `Component ${index + 1} of ${catalog.length}`;
        titleEl.textContent = item.title;
        filesEl.textContent = 'js/components/' + item.id + '/  ·  ' + item.files.join('  ·  ');

        const teardown = await item.render(stage);
        if (typeof teardown === 'function') cleanup = teardown;
        renderPagination();
    }

    function renderPagination() {
        pagination.textContent = '';

        const prev = makeButton('‹ Prev', () => renderPage(current - 1));
        prev.disabled = current === 0;
        pagination.appendChild(prev);

        catalog.forEach((_, i) => {
            const btn = makeButton(String(i + 1), () => renderPage(i));
            if (i === current) btn.classList.add('is-active');
            pagination.appendChild(btn);
        });

        const next = makeButton('Next ›', () => renderPage(current + 1));
        next.disabled = current === catalog.length - 1;
        pagination.appendChild(next);
    }

    function makeButton(label, onClick) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.addEventListener('click', onClick);
        return b;
    }

    // Header theme switcher (the theme-switcher component, inline)
    mountThemeSwitcher('#gallery-theme', { inline: true });

    renderPage(0);
</script>

</body>
</html>
