<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass — Interactive Modal Study</title>
    <link rel="stylesheet" href="/css/global/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --radius: 0.5rem;
            --background: oklch(0.2 0.035 255);
            --foreground: oklch(0.96 0.018 94);
            --card: oklch(0.25 0.035 255);
            --card-foreground: oklch(0.96 0.018 94);
            --primary: oklch(0.91 0.16 104);
            --primary-foreground: oklch(0.19 0.03 255);
            --secondary: oklch(0.3 0.04 255);
            --secondary-foreground: oklch(0.96 0.018 94);
            --muted: oklch(0.28 0.03 255);
            --muted-foreground: oklch(0.77 0.025 245);
            --accent: oklch(0.76 0.13 175);
            --accent-foreground: oklch(0.88 0.12 168);
            --border: oklch(0.94 0.02 250 / 0.18);
            --ring: oklch(0.91 0.16 104);
            --shadow-button: 0 12px 36px oklch(0.08 0.03 255 / 0.36);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-color: var(--border);
        }

        body {
            font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            letter-spacing: 0;
        }

        .glass-page {
            position: relative;
            min-height: 100dvh;
            overflow: hidden;
            background-color: var(--background);
            color: var(--foreground);
        }

        .scene-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(oklch(1 0 0 / 0.045) 1px, transparent 1px),
                linear-gradient(90deg, oklch(1 0 0 / 0.045) 1px, transparent 1px),
                radial-gradient(circle at 74% 44%, oklch(0.77 0.14 174 / 0.36), transparent 27%),
                radial-gradient(circle at 60% 66%, oklch(0.9 0.17 104 / 0.22), transparent 24%);
            background-size: 64px 64px, 64px 64px, 100% 100%, 100% 100%;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
        }

        .glass-nav {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 1.5rem;
        }

        @media (min-width: 640px) {
            .glass-nav { padding-left: 2.5rem; padding-right: 2.5rem; }
        }

        @media (min-width: 1024px) {
            .glass-nav { padding-left: 4rem; padding-right: 4rem; }
        }

        .glass-nav__brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            color: inherit;
        }

        .glass-nav__logo {
            display: flex;
            width: 2.25rem;
            height: 2.25rem;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background-color: oklch(0.25 0.035 255 / 0.5);
            backdrop-filter: blur(12px);
        }

        .glass-nav__logo svg {
            width: 1rem;
            height: 1rem;
        }

        .glass-nav__meta {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--muted-foreground);
        }

        .glass-hero {
            position: relative;
            z-index: 10;
            display: flex;
            min-height: calc(100dvh - 88px);
            max-width: 72rem;
            margin: 0 auto;
            align-items: center;
            padding: 0 1.5rem 5rem;
        }

        @media (min-width: 640px) {
            .glass-hero { padding-left: 2.5rem; padding-right: 2.5rem; }
        }

        @media (min-width: 1024px) {
            .glass-hero { padding-left: 4rem; padding-right: 4rem; }
        }

        .glass-hero__content {
            max-width: 42rem;
        }

        .glass-hero__eyebrow {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-foreground);
        }

        .glass-hero__eyebrow::before {
            content: '';
            height: 1px;
            width: 2rem;
            background-color: var(--accent);
        }

        .glass-hero__title {
            max-width: 36rem;
            font-size: 3rem;
            font-weight: 600;
            line-height: 0.98;
            letter-spacing: 0;
        }

        @media (min-width: 640px) {
            .glass-hero__title { font-size: 4.5rem; }
        }

        .glass-hero__body {
            margin-top: 1.75rem;
            max-width: 32rem;
            font-size: 1rem;
            line-height: 1.75;
            color: var(--muted-foreground);
        }

        @media (min-width: 640px) {
            .glass-hero__body { font-size: 1.125rem; }
        }

        .glass-hero__cta {
            display: inline-flex;
            min-height: 2.75rem;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            padding: 0 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 300ms ease;
            cursor: pointer;
            margin-top: 2.25rem;
            background-color: var(--primary);
            color: var(--primary-foreground);
            box-shadow: var(--shadow-button);
        }

        .glass-hero__cta:hover {
            transform: translateY(-2px);
            background-color: oklch(0.91 0.16 104 / 0.9);
        }

        .glass-hero__cta svg {
            width: 1rem;
            height: 1rem;
        }

        .glass-hero__sculpture {
            position: absolute;
            right: -12rem;
            top: 50%;
            transform: translateY(-50%);
            width: 41rem;
            height: 41rem;
            pointer-events: none;
            display: none;
        }

        @media (min-width: 1024px) {
            .glass-hero__sculpture { display: block; }
        }

        .scene-ring {
            position: absolute;
            inset: 2rem;
            border: 5.5rem solid oklch(0.78 0.13 177 / 0.78);
            border-radius: 9999px;
            box-shadow: inset 0 0 5rem oklch(0.93 0.1 175 / 0.35), 0 0 8rem oklch(0.69 0.15 180 / 0.2);
            transform: rotate(-18deg) skewY(9deg);
        }

        .scene-core {
            position: absolute;
            inset: 10rem;
            border-radius: 42% 58% 65% 35%;
            background: linear-gradient(145deg, oklch(0.91 0.16 104), oklch(0.76 0.14 176));
            box-shadow: 0 0 6rem oklch(0.85 0.15 128 / 0.33);
            transform: rotate(21deg);
        }

        /* Prominent background text so the refraction is visible behind the modal */
        .glass-hero__background-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            font-size: clamp(4rem, 15vw, 14rem);
            font-weight: 700;
            color: oklch(0.96 0.018 94 / 0.08);
            pointer-events: none;
            white-space: nowrap;
            z-index: 1;
            line-height: 1;
        }
    </style>
</head>
<body>
    <main class="glass-page" id="glass-page">
        <div class="scene-grid" aria-hidden="true"></div>

        <nav class="glass-nav">
            <a href="/" class="glass-nav__brand">
                <span class="glass-nav__logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                </span>
                Glass Lab
            </a>
            <span class="glass-nav__meta">Study 01 / Refraction</span>
        </nav>

        <section class="glass-hero">
            <div class="glass-hero__content">
                <p class="glass-hero__eyebrow">Interface material study</p>
                <h1 class="glass-hero__title">Light, shaped into an interface.</h1>
                <p class="glass-hero__body">A live study in transparency, depth, and optical distortion. Open the specimen to see the layers interact.</p>
                <button type="button" class="glass-hero__cta" id="open-specimen">
                    Open specimen
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
                </button>
            </div>

            <div class="glass-hero__sculpture" aria-hidden="true">
                <div class="scene-ring"></div>
                <div class="scene-core"></div>
            </div>

            <!-- Large background text to visibly refract behind the modal -->
            <div class="glass-hero__background-text" aria-hidden="true">REFRACTION</div>
        </section>
    </main>

    <div id="liquid-glass-modal-host"></div>

    <script type="module">
        import { mountLiquidGlassModal } from '/js/components/liquid_glass_modal/liquid_glass_modal.js';

        const trigger = document.getElementById('open-specimen');
        trigger.addEventListener('click', () => {
            mountLiquidGlassModal('#liquid-glass-modal-host', {
                trigger,
                onClose: () => trigger.focus(),
            });
        });
    </script>
</body>
</html>
