<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10162a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})</script>
<title>COLLABO — Post</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/gaze.css">
<link rel="stylesheet" href="/css/pages/post-view.css">
</head>
<body>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<div class="sp-shell">
    <div class="sp-top">
        <header class="tt-bar">
            <div class="tt-tabs">
                <a class="tt-icon" id="back" href="/HTML-pages/gaze.html" aria-label="Back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </a>
                <h1 class="tt-title">Post</h1>
            </div>
            <div class="tt-end">
                <span id="bell-slot"></span>
            </div>
        </header>
    </div>

    <main id="section" class="sp-section" aria-live="polite">
        <div id="post"></div>
        <div id="comments"></div>
    </main>
</div>

<div id="bottom-nav"></div>
<div class="sp-toast" id="toast" role="status"></div>

<script type="module" src="/js/pages/post-view.js"></script>
<script type="module" src="/js/services/bell.js"></script>
</body>
</html>
