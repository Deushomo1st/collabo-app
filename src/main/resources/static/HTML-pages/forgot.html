<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10162a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})</script>
<title>COLLABO — Reset your password</title>
<link rel="stylesheet" href="/css/global/global.css">
<!-- Apply the saved theme before first paint (see theme-switcher README) -->
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<div class="sp-shell">
    <div class="lg-theme" id="theme-slot"></div>
    <main class="lg-card sp-glass">
        <h1 class="lg-title">Reset your password</h1>
        <p class="sp-sub" id="intro">Enter your email and we will send you a 6-digit code.</p>

        <form class="sp-form" id="ask-form" novalidate>
            <label for="email">Email
                <input class="sp-input" id="email" name="email" type="email" autocomplete="email" required autofocus>
            </label>
            <p class="lg-error" id="ask-error" role="alert" hidden></p>
            <button class="sp-btn sp-btn--brand" id="ask-submit" type="submit">Send the code</button>
        </form>

        <form class="sp-form" id="reset-form" novalidate hidden>
            <label for="code">The 6-digit code
                <input class="sp-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
            </label>
            <label for="password">New password
                <input class="sp-input" id="password" name="password" type="password" autocomplete="new-password" required>
            </label>
            <p class="lg-error" id="reset-error" role="alert" hidden></p>
            <button class="sp-btn sp-btn--brand" id="reset-submit" type="submit">Set the new password</button>
            <button class="sp-btn" id="again" type="button">Send a new code</button>
        </form>

        <p class="lg-foot"><a href="/HTML-pages/login.html">Back to sign in</a></p>
    </main>
</div>

<script type="module" src="/js/pages/forgot.js"></script>
</body>
</html>
