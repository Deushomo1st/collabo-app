services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collabo
      POSTGRES_USER: collabo_user
      POSTGRES_PASSWORD: collabo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/collabo
      SPRING_DATASOURCE_USERNAME: collabo_user
      SPRING_DATASOURCE_PASSWORD: collabo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - db

volumes:
  postgres_data: