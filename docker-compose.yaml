services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collabo
      POSTGRES_USER: collabo_user
      POSTGRES_PASSWORD: collabo_password
    ports:
      - "127.0.0.1:5432:5432"  # loopback only — DB is not reachable from the internet
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8081:8080"  # loopback only — reach via SSH tunnel
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env  # <-- This explicitly tells Docker to read the .env file
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: