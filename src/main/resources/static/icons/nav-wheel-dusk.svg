<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Omni wheel">
  <!-- the collapsed nav button ("omni wheel"), dusk theme: rim, inner bubble and a house. Transparent background. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dae2"/></linearGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f38"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="120" cy="120" r="96" fill="#ffffff" opacity=".6" filter="url(#glow)"/>
  <circle cx="120" cy="120" r="92" fill="url(#rim)" stroke="#ffffff" stroke-width="3" filter="url(#drop)"/>
  <circle cx="120" cy="120" r="72" fill="url(#bub)"/>
  <g transform="translate(86 86) scale(2.83)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></g>
</svg>
