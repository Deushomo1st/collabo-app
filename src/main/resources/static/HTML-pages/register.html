<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10162a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})</script>
<title>COLLABO — Create an account</title>
<link rel="stylesheet" href="/css/global/global.css">
<script>try{var t=localStorage.getItem('collaboTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/workspace.css">
<link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>
<div class="sp-aurora" aria-hidden="true">
    <div class="sp-aurora__blob sp-aurora__blob--a"></div>
    <div class="sp-aurora__blob sp-aurora__blob--b"></div>
    <div class="sp-aurora__blob sp-aurora__blob--c"></div>
</div>

<div class="sp-shell">
    <main class="lg-card sp-glass">
        <h1 class="lg-title">Create your account</h1>
        <p class="sp-sub">Your people are out there. Let's collabo.</p>
        <form class="sp-form" id="registerForm">
            <label for="email">Email address
                <input class="sp-input" type="email" id="email" required placeholder="you@example.com" autocomplete="email">
            </label>
            <label for="firstName">First name
                <input class="sp-input" type="text" id="firstName" required maxlength="40" placeholder="Anna" autocomplete="given-name">
            </label>
            <label for="lastName">Last name
                <input class="sp-input" type="text" id="lastName" required maxlength="40" placeholder="Bartley" autocomplete="family-name">
            </label>
            <label for="username">Username
                <input class="sp-input" type="text" id="username" required placeholder="johndoe" autocomplete="username">
            </label>
            <label for="password">Password
                <input class="sp-input" type="password" id="password" required autocomplete="new-password">
            </label>
            <label for="confirm">Confirm password
                <input class="sp-input" type="password" id="confirm" required autocomplete="new-password">
            </label>
            <button class="sp-btn sp-btn--brand" type="submit" id="submitBtn">Create Account</button>
        </form>

        <div class="lg-box" id="verifyBox">
            <p id="verifyPrompt"></p>
            <input class="sp-input" type="text" id="otpCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
            <div class="lg-row">
                <button class="sp-btn sp-btn--brand" type="button" id="verifyOtpBtn">Verify code</button>
                <button class="sp-btn" type="button" id="resendOtpBtn">Resend code</button>
            </div>
        </div>

        <div class="lg-box" id="challengeBox">
            <label id="challengeText"></label>
            <input class="sp-input" type="text" id="challengeAnswer" inputmode="numeric" autocomplete="off" placeholder="Your answer">
            <button class="sp-btn sp-btn--brand" type="button" id="verifyBtn">Verify</button>
        </div>

        <div id="messageBox" class="message"></div>
        <p class="lg-foot">Already have an account? <a href="/HTML-pages/login.html">Sign in</a></p>
    </main>
</div>

<script type="module">
    import '/js/components/password-toggle.js';
    import { registerUser, verifyOtp, resendOtp } from '../js/services/api.js';

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageBox = document.getElementById('messageBox');
    const challengeBox = document.getElementById('challengeBox');
    const challengeText = document.getElementById('challengeText');
    const challengeAnswer = document.getElementById('challengeAnswer');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyBox = document.getElementById('verifyBox');
    const verifyPrompt = document.getElementById('verifyPrompt');
    const otpCode = document.getElementById('otpCode');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');

    let pending = null;       // held registration fields across a challenge
    let pendingToken = null;  // challenge token minted by the server
    let countdownTimer = null;
    let registeredEmail = null; // email that needs OTP confirmation

    function isSecure(pw) {
        return pw.length >= 8 &&
               /[A-Z]/.test(pw) &&
               /[a-z]/.test(pw) &&
               /\d/.test(pw) &&
               /[^A-Za-z0-9]/.test(pw);
    }

    function showMessage(msg, isError) {
        messageBox.textContent = msg;
        messageBox.className = isError ? 'message error' : 'message success';
        messageBox.style.display = 'block';
        messageBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideMessage() { messageBox.style.display = 'none'; }

    function showVerify(message) {
        verifyPrompt.textContent = message;
        otpCode.value = '';
        verifyBox.style.display = 'block';
    }

    function showChallenge(message, question, token) {
        pendingToken = token;
        challengeText.textContent = `${message} — ${question}`;
        challengeAnswer.value = '';
        challengeBox.style.display = 'block';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Create Account';
        challengeAnswer.focus();
    }

    function startCountdown(seconds) {
        let remaining = seconds;
        challengeBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Create Account';
        const tick = () => {
            if (remaining <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                hideMessage();
                return;
            }
            showMessage(`Too many attempts. Try again in ${remaining}s`, true);
            submitBtn.textContent = `Wait ${remaining}s`;
            remaining--;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    async function attempt(payload) {
        hideMessage();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        try {
            const data = await registerUser(payload);
            form.style.display = 'none';
            challengeBox.style.display = 'none';
            pending = null;
            pendingToken = null;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
            if (data.verified) {
                // Pre-verified (test) account — no OTP step needed.
                showMessage(`Account created${data.test ? ' (test mode)' : ''}. You're good to go, ${data.username}.`, false);
            } else {
                registeredEmail = data.email;
                showVerify(`We sent a 6-digit code to ${registeredEmail}. Enter it below to confirm your account.`);
            }
        } catch (error) {
            if (error.challenge) {
                pending = payload;
                showChallenge(error.message, error.challenge, error.challengeToken);
            } else if (error.retryAfterSeconds > 0) {
                startCountdown(error.retryAfterSeconds);
            } else if (error.requiresVerification) {
                registeredEmail = payload.email;
                form.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                showVerify(error.message);
            } else {
                showMessage(error.message || 'Something went wrong', true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        // Confirm-password must match
        if (password !== confirm) {
            showMessage('Passwords do not match', true);
            return;
        }

        // Weak-password consent: the server rejects weak passwords unless the
        // user explicitly proceeds (flagged below).
        let weakPasswordAccepted = false;
        if (!isSecure(password)) {
            const proceed = window.confirm(
                'Password not yet secure. You can proceed and change it later. Proceed anyway?'
            );
            if (!proceed) return;
            weakPasswordAccepted = true;
        }

        pending = { email, firstName, lastName, username, password, weakPasswordAccepted };
        await attempt({ ...pending });
    });

    verifyBtn.addEventListener('click', async function() {
        const answer = challengeAnswer.value.trim();
        if (!answer || !pending) return;
        await attempt({ ...pending, challengeToken: pendingToken, challengeAnswer: answer });
    });

    verifyOtpBtn.addEventListener('click', async function() {
        const code = otpCode.value.trim();
        if (!code || !registeredEmail) return;
        verifyOtpBtn.disabled = true;
        try {
            const data = await verifyOtp(registeredEmail, code);
            verifyBox.style.display = 'none';
            showMessage(`Account verified! Welcome, ${data.username}.`, false);
            form.reset();
        } catch (error) {
            showMessage(error.message || 'Verification failed', true);
        } finally {
            verifyOtpBtn.disabled = false;
        }
    });

    resendOtpBtn.addEventListener('click', async function() {
        if (!registeredEmail) return;
        resendOtpBtn.disabled = true;
        try {
            await resendOtp(registeredEmail);
            showMessage('A new code has been sent to your email.', false);
        } catch (error) {
            showMessage(error.message || 'Could not resend the code', true);
        } finally {
            resendOtpBtn.disabled = false;
        }
    });
</script>

</body>
</html>
