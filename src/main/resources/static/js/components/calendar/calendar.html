<div class="calendar calendar--range">
    <div class="calendar__cols">
        <div class="calendar__col">
            <div class="calendar__label">From</div>
            <div class="calendar__pane calendar__pane--from"></div>
        </div>
        <div class="calendar__gap"></div>
        <div class="calendar__col">
            <div class="calendar__label">To</div>
            <div class="calendar__pane calendar__pane--to"></div>
        </div>
    </div>
    <div class="calendar__foot">
        <span class="calendar__range-text" aria-live="polite"></span>
        <div class="glass-blur-dialog__actions">
            <button type="button" class="glass-blur-dialog__btn glass-blur-dialog__btn--ghost" data-action="clear">Clear</button>
            <button type="button" class="glass-blur-dialog__btn glass-blur-dialog__btn--ghost" data-action="cancel">Cancel</button>
            <button type="button" class="glass-blur-dialog__btn" data-action="apply">Apply</button>
        </div>
    </div>
</div>
