<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join COLLABO</title>
    <link rel="stylesheet" href="/css/global/global.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #111827; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #374151; font-size: 0.875rem; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't break width */
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
            display: none;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
        #challengeBox {
            background: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }
        #challengeText { color: #92400e; font-weight: 600; }
        #challengeBox input { margin-top: 0.5rem; }
        #challengeBox button { margin-top: 0.5rem; }
        #verifyBox {
            background: #eff6ff;
            border: 1px solid #93c5fd;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }
        #verifyPrompt { color: #1e40af; font-size: 0.875rem; margin-top: 0; }
        #verifyBox input { margin-top: 0.5rem; }
        #verifyBox button { margin-top: 0.5rem; }
        #resendOtpBtn { background-color: transparent; color: #2563eb; width: auto; margin-left: 0.5rem; }
        #resendOtpBtn:hover { background-color: #dbeafe; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create your COLLABO account</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="johndoe">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" required placeholder="••••••••">
        </div>
        <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div id="verifyBox">
        <p id="verifyPrompt"></p>
        <input type="text" id="otpCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        <div>
            <button type="button" id="verifyOtpBtn">Verify code</button>
            <button type="button" id="resendOtpBtn">Resend code</button>
        </div>
    </div>

    <div id="challengeBox">
        <label id="challengeText"></label>
        <input type="text" id="challengeAnswer" inputmode="numeric" autocomplete="off" placeholder="Your answer">
        <button type="button" id="verifyBtn">Verify</button>
    </div>

    <div id="messageBox" class="message"></div>
</div>

<script type="module">
    import { registerUser, verifyOtp, resendOtp } from '../js/services/api.js';

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageBox = document.getElementById('messageBox');
    const challengeBox = document.getElementById('challengeBox');
    const challengeText = document.getElementById('challengeText');
    const challengeAnswer = document.getElementById('challengeAnswer');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyBox = document.getElementById('verifyBox');
    const verifyPrompt = document.getElementById('verifyPrompt');
    const otpCode = document.getElementById('otpCode');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');

    let pending = null;       // held registration fields across a challenge
    let pendingToken = null;  // challenge token minted by the server
    let countdownTimer = null;
    let registeredEmail = null; // email that needs OTP confirmation

    function isSecure(pw) {
        return pw.length >= 8 &&
               /[A-Z]/.test(pw) &&
               /[a-z]/.test(pw) &&
               /\d/.test(pw) &&
               /[^A-Za-z0-9]/.test(pw);
    }

    function showMessage(msg, isError) {
        messageBox.textContent = msg;
        messageBox.className = isError ? 'message error' : 'message success';
        messageBox.style.display = 'block';
    }

    function hideMessage() { messageBox.style.display = 'none'; }

    function showVerify(message) {
        verifyPrompt.textContent = message;
        otpCode.value = '';
        verifyBox.style.display = 'block';
    }

    function showChallenge(message, question, token) {
        pendingToken = token;
        challengeText.textContent = `${message} — ${question}`;
        challengeAnswer.value = '';
        challengeBox.style.display = 'block';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Create Account';
        challengeAnswer.focus();
    }

    function startCountdown(seconds) {
        let remaining = seconds;
        challengeBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Create Account';
        const tick = () => {
            if (remaining <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                hideMessage();
                return;
            }
            showMessage(`Too many attempts. Try again in ${remaining}s`, true);
            submitBtn.textContent = `Wait ${remaining}s`;
            remaining--;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    async function attempt(payload) {
        hideMessage();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        try {
            const data = await registerUser(payload);
            form.style.display = 'none';
            challengeBox.style.display = 'none';
            pending = null;
            pendingToken = null;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
            if (data.verified) {
                // Pre-verified (test) account — no OTP step needed.
                showMessage(`Account created${data.test ? ' (test mode)' : ''}. You're good to go, ${data.username}.`, false);
            } else {
                registeredEmail = data.email;
                showVerify(`We sent a 6-digit code to ${registeredEmail}. Enter it below to confirm your account.`);
            }
        } catch (error) {
            if (error.challenge) {
                pending = payload;
                showChallenge(error.message, error.challenge, error.challengeToken);
            } else if (error.retryAfterSeconds > 0) {
                startCountdown(error.retryAfterSeconds);
            } else if (error.requiresVerification) {
                registeredEmail = payload.email;
                form.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                showVerify(error.message);
            } else {
                showMessage(error.message || 'Something went wrong', true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        // Confirm-password must match
        if (password !== confirm) {
            showMessage('Passwords do not match', true);
            return;
        }

        // Weak-password consent: the server rejects weak passwords unless the
        // user explicitly proceeds (flagged below).
        let weakPasswordAccepted = false;
        if (!isSecure(password)) {
            const proceed = window.confirm(
                'Password not yet secure. You can proceed and change it later. Proceed anyway?'
            );
            if (!proceed) return;
            weakPasswordAccepted = true;
        }

        pending = { email, username, password, weakPasswordAccepted };
        await attempt({ ...pending });
    });

    verifyBtn.addEventListener('click', async function() {
        const answer = challengeAnswer.value.trim();
        if (!answer || !pending) return;
        await attempt({ ...pending, challengeToken: pendingToken, challengeAnswer: answer });
    });

    verifyOtpBtn.addEventListener('click', async function() {
        const code = otpCode.value.trim();
        if (!code || !registeredEmail) return;
        verifyOtpBtn.disabled = true;
        try {
            const data = await verifyOtp(registeredEmail, code);
            verifyBox.style.display = 'none';
            showMessage(`Account verified! Welcome, ${data.username}.`, false);
            form.reset();
        } catch (error) {
            showMessage(error.message || 'Verification failed', true);
        } finally {
            verifyOtpBtn.disabled = false;
        }
    });

    resendOtpBtn.addEventListener('click', async function() {
        if (!registeredEmail) return;
        resendOtpBtn.disabled = true;
        try {
            await resendOtp(registeredEmail);
            showMessage('A new code has been sent to your email.', false);
        } catch (error) {
            showMessage(error.message || 'Could not resend the code', true);
        } finally {
            resendOtpBtn.disabled = false;
        }
    });
</script>

</body>
</html>
